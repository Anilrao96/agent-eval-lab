[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-lab"
version = "0.1.0"
description = "Trace-aware evaluation and regression gates for LLM applications and tool-using agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Anil Rao"}]
dependencies = []

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.setuptools.packages.find]
include = ["agent_eval*"]

[tool.setuptools.package-data]
agent_eval = ["data/*.json", "data/*.jsonl"]

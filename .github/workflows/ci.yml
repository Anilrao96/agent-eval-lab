name: Evaluate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and mock HTTP integration tests
        run: python -m unittest discover -s tests -v
      - name: Offline regression gate
        run: python -m agent_eval demo --out runs/ci --repetitions 3
      - name: Build and install wheel
        run: python -m pip install . --no-deps
      - name: Test installed CLI and bundled datasets outside the checkout
        working-directory: ${{ runner.temp }}
        run: agent-eval demo --out packaged-smoke
      - name: Save evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-python-${{ matrix.python-version }}
          path: runs/ci
